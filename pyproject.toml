[project]
name = "atelier"
version = "0.1.0"
description = "Image/video editing webapp with Grok and Stable Diffusion WebUI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ty>=0.0.1a0",
    "pytest>=8.0.0",
]

[project.scripts]
atelier = "atelier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atelier"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.uv]
dev-dependencies = [
    "black>=24.0.0",
    "ty>=0.0.1a0",
    "pytest>=8.0.0",
]
