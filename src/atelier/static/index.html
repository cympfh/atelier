<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>atelier</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="logo">atelier</span>
        <span class="tag">image · video · lineage</span>
      </div>
      <div class="lineage-bar">
        <label class="lineage-pick">
          <span>Lineage</span>
          <select id="lineageSelect"></select>
        </label>
        <input id="lineageName" type="text" placeholder="lineage name" />
        <button type="button" id="lineageRename" class="ghost">Rename</button>
        <button type="button" id="lineageNew" class="ghost">New</button>
        <button type="button" id="lineageSave" class="ghost">Save</button>
      </div>
      <div id="status" class="status">ready</div>
    </header>

    <main class="layout">
      <section class="panel compose">
        <h2>Compose</h2>
        <label class="field">
          <span>Backend</span>
          <select id="backend"></select>
        </label>
        <label class="field">
          <span>Mode</span>
          <select id="mode">
            <option value="t2i">Text → Image</option>
            <option value="i2i">Image → Image</option>
            <option value="t2v">Text → Video</option>
            <option value="i2v">Image → Video</option>
          </select>
        </label>
        <label class="field grow">
          <span>Prompt <em>@Image1 @Video1</em></span>
          <textarea id="prompt" rows="5" placeholder="Describe the result… use @Image1 to reference inputs"></textarea>
        </label>
        <div id="params" class="params"></div>
        <div class="slots">
          <div class="slots-head">
            <span>Input slots</span>
            <button type="button" id="clearSlots" class="ghost">Clear</button>
          </div>
          <div id="slotList" class="slot-list"></div>
        </div>
        <div class="actions">
          <button type="button" id="generate" class="primary">Generate</button>
          <label class="upload btn">
            Upload
            <input type="file" id="file" accept="image/*,video/*" hidden />
          </label>
        </div>
        <pre id="error" class="error hidden"></pre>
      </section>

      <section class="panel preview">
        <h2>Preview</h2>
        <div id="preview" class="preview-stage empty">Select or generate media</div>
        <div class="preview-meta" id="previewMeta"></div>
        <div class="preview-actions">
          <a id="download" class="btn hidden" href="#" download>Download</a>
          <button type="button" id="useAsInput" class="ghost hidden">Use as input</button>
        </div>
      </section>

      <section class="panel gallery">
        <h2>Gallery</h2>
        <div id="gallery" class="gallery-grid"></div>
      </section>

      <section class="panel lineage">
        <h2>Lineage</h2>
        <div id="tree" class="tree"></div>
      </section>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
